  name: Release

  on:
    push:
      tags:
        - "v*"

  permissions:
    contents: write

  concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    build:
      strategy:
        fail-fast: false

        matrix:
          include:
            - os: windows-latest
              target: --win
              artifact: Windows

            - os: ubuntu-latest
              target: --linux
              artifact: Linux

      runs-on: ${{ matrix.os }}

      steps:
        - name: Checkout repository
          uses: actions/checkout@v5

        - name: Setup Node.js
          uses: actions/setup-node@v5
          with:
            node-version: 22
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Verify runtime files
          shell: bash
          run: |
            test -d assets
            test -d utils
            
            test -f main.js
            test -f preload.js
            
            test -f index.html
            test -f renderer.js
            test -f styles.css

        - name: Build packages
          run: npx electron-builder ${{ matrix.target }} --publish never

        - name: Upload build artifacts
          uses: actions/upload-artifact@v4
          with:
            name: ${{ matrix.artifact }}
            path: dist/

    release:
      needs: build
      runs-on: ubuntu-latest

      steps:
        - name: Download build artifacts
          uses: actions/download-artifact@v5
          with:
            path: artifacts

        - name: Generate combined SHA256SUMS
          shell: bash
          run: |
            cd artifacts
            
            find . -type f -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            generate_release_notes: true
            files: |
              artifacts/**/*.exe
              artifacts/**/*.AppImage
              artifacts/**/*.deb
              artifacts/**/*.tar.xz
              artifacts/SHA256SUMS
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}