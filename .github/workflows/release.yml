name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            target: --win

          - os: ubuntu-latest
            target: --linux

          - os: macos-latest
            target: --mac

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify runtime files
        shell: bash
        run: |
          test -d assets
          test -d utils

          test -f main.js
          test -f preload.js

          test -f index.html
          test -f renderer.js
          test -f styles.css

      - name: Build packages
        run: npx electron-builder ${{ matrix.target }}

      - name: Generate .sha256 files (Windows)

        if: runner.os == 'Windows'

        shell: pwsh

        run: |
          Get-ChildItem dist -File | ForEach-Object {

            if ($_.Extension -ne ".sha256") {

              $hash = Get-FileHash $_.FullName -Algorithm SHA256

              $output = "$($hash.Hash)  $($_.Name)"

              Set-Content -Path "$($_.FullName).sha256" -Value $output

            }

          }

      - name: Generate .sha256 files (Linux/macOS)

        if: runner.os != 'Windows'

        shell: bash

        run: |
          find dist -type f ! -name "*.sha256" | while read file
          do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Upload artifacts

        uses: actions/upload-artifact@v4

        with:
          name: ${{ runner.os }}

          path: dist/

  release:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Download artifacts

        uses: actions/download-artifact@v4

        with:
          path: artifacts

      - name: Create GitHub Release

        uses: softprops/action-gh-release@v2

        with:
          files: artifacts/**/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}